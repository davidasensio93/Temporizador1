<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFF8ED">
<title>Reloj de Tiempo</title>
<style>
  :root{
    --bg: #FFF8ED;
    --ink: #2B2E4A;
    --ink-soft: #6B6F93;
    --teal: #2EC4B6;
    --teal-dark: #1FA093;
    --amber: #FFB100;
    --amber-dark: #E39900;
    --coral: #FF5C5C;
    --coral-dark: #E24545;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 10px) 14px calc(env(safe-area-inset-bottom, 10px) + 6px);
    gap: 8px;
  }

  .app-title {
    color: var(--ink-soft);
    font-size: clamp(13px, 3.4vw, 17px);
    font-weight: 700;
    letter-spacing: 0.5px;
    text-align: center;
    margin-top: 0;
  }

  /* ---------- Readout ---------- */
  .readout-wrap {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 0;
  }

  .time-readout {
    font-size: clamp(40px, 13vw, 72px);
    font-weight: 800;
    color: var(--ink);
    line-height: 1;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s ease, transform 0.15s ease;
  }

  .time-readout.pulse { animation: pulseBig 1s ease-in-out infinite; }

  @keyframes pulseBig {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .state-label {
    margin-top: 2px;
    font-size: clamp(11px, 2.8vw, 14px);
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ---------- Linear progress bar (signature element, la MAS importante) ---------- */
  .bar-track {
    width: 100%;
    max-width: 480px;
    height: clamp(34px, 10vw, 54px);
    background: #EDEAE0;
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 2px 6px rgba(43,46,74,0.10), 0 2px 0 #E4DFD1;
    position: relative;
    flex-shrink: 0;
  }

  .bar-fill {
    height: 100%;
    width: 100%;
    background: var(--teal);
    border-radius: 999px;
    transition: width 0.25s linear, background 0.25s ease;
  }

  /* ---------- Sections ---------- */
  .panel {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 16px;
    padding: 8px 12px;
    box-shadow: 0 3px 0 #E4DFD1, 0 6px 14px -8px rgba(43,46,74,0.14);
  }

  .panel-label {
    font-size: clamp(10px, 2.6vw, 12px);
    font-weight: 800;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 5px;
  }

  /* ---------- Custom time setter ---------- */
  .custom-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .num-field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .num-field label {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  input[type="number"] {
    width: 60px;
    font-size: clamp(15px, 3.8vw, 18px);
    font-weight: 800;
    color: var(--ink);
    text-align: center;
    border: 2px solid #EDEAE0;
    border-radius: 10px;
    padding: 5px 4px;
    background: var(--bg);
    font-variant-numeric: tabular-nums;
  }

  input[type="number"]:focus {
    outline: none;
    border-color: var(--teal);
  }

  .colon {
    font-size: 18px;
    font-weight: 800;
    color: var(--ink-soft);
    margin-top: 10px;
  }

  .btn-fijar {
    margin-left: auto;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-weight: 800;
    font-size: clamp(13px, 3.2vw, 15px);
    padding: 9px 14px;
    border-radius: 12px;
    box-shadow: 0 3px 0 #1A1C30;
    transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s ease;
  }
  .btn-fijar:active { transform: translateY(3px); box-shadow: 0 0 0 #1A1C30; }
  .btn-fijar:disabled { opacity: 0.4; }

  /* ---------- Presets ---------- */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .preset-btn {
    border: none;
    background: var(--bg);
    color: var(--ink);
    font-weight: 800;
    font-size: clamp(12px, 3vw, 14px);
    padding: 7px 12px;
    border-radius: 12px;
    box-shadow: 0 3px 0 #EDEAE0;
    min-width: 50px;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s ease;
  }

  .preset-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0px 0 #EDEAE0;
  }

  .preset-btn.selected {
    background: var(--teal);
    color: #ffffff;
    box-shadow: 0 3px 0 var(--teal-dark);
  }

  .preset-btn:disabled { opacity: 0.5; }

  /* ---------- Adjust time (add / subtract) ---------- */
  .adjust-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .adjust-input-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .adjust-input-wrap label {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  #adjustAmount {
    width: 80px;
  }

  .adjust-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    font-weight: 800;
    font-size: clamp(17px, 4.2vw, 22px);
    padding: 8px 0;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s ease;
  }
  .adjust-btn:active { transform: translateY(3px); }
  .adjust-btn:disabled { opacity: 0.4; }

  .btn-add {
    background: var(--teal);
    box-shadow: 0 4px 0 var(--teal-dark);
  }
  .btn-add:active { box-shadow: 0 1px 0 var(--teal-dark); }

  .btn-sub {
    background: var(--coral);
    box-shadow: 0 4px 0 var(--coral-dark);
  }
  .btn-sub:active { box-shadow: 0 1px 0 var(--coral-dark); }

  .adjust-hint {
    font-size: clamp(10px, 2.6vw, 11px);
    color: var(--ink-soft);
    margin-top: 4px;
    text-align: center;
  }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 480px;
    margin-top: auto;
    margin-bottom: 2px;
  }

  .ctrl-btn {
    flex: 1;
    border: none;
    border-radius: 18px;
    font-weight: 800;
    font-size: clamp(13px, 3.4vw, 16px);
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: #ffffff;
    transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s ease;
  }

  .ctrl-btn:active { transform: translateY(3px); }
  .ctrl-btn svg { width: 24px; height: 24px; }

  .btn-start { background: var(--teal); box-shadow: 0 5px 0 var(--teal-dark); }
  .btn-start:active { box-shadow: 0 2px 0 var(--teal-dark); }

  .btn-pause { background: var(--amber); box-shadow: 0 5px 0 var(--amber-dark); }
  .btn-pause:active { box-shadow: 0 2px 0 var(--amber-dark); }

  .btn-reset { background: #ffffff; color: var(--ink); box-shadow: 0 5px 0 #E4DFD1; flex: 0.7; }
  .btn-reset:active { box-shadow: 0 2px 0 #E4DFD1; }

  .ctrl-btn:disabled { opacity: 0.4; box-shadow: none; }

  .hidden { display: none !important; }

  .finished-banner {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--coral);
    color: #fff;
    font-weight: 800;
    padding: 10px 20px;
    border-radius: 30px;
    box-shadow: 0 6px 16px -6px rgba(255,92,92,0.6);
    animation: bob 0.9s ease-in-out infinite;
    z-index: 10;
    text-align: center;
    max-width: 90vw;
  }

  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .time-readout.pulse, .finished-banner { animation: none; }
  }

  @media (max-height: 640px) {
    body { gap: 6px; }
    .panel { padding: 6px 10px; }
    .panel-label { margin-bottom: 3px; }
  }
</style>
</head>
<body>

  <div class="app-title">⏰ Mi Reloj de Tiempo</div>

  <div class="readout-wrap">
    <div class="time-readout" id="readout">05:00</div>
    <div class="state-label" id="stateLabel">Listo</div>
  </div>

  <div class="bar-track">
    <div class="bar-fill" id="barFill"></div>
  </div>

  <div class="panel">
    <div class="panel-label">Poner tiempo exacto</div>
    <div class="custom-row">
      <div class="num-field">
        <label for="customMin">Min</label>
        <input type="number" id="customMin" min="0" max="180" value="5" inputmode="numeric">
      </div>
      <div class="colon">:</div>
      <div class="num-field">
        <label for="customSec">Seg</label>
        <input type="number" id="customSec" min="0" max="59" value="0" inputmode="numeric">
      </div>
      <button class="btn-fijar" id="btnFijar">Fijar</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-label">Rápidos</div>
    <div class="presets" id="presets">
      <button class="preset-btn" data-min="1">1 min</button>
      <button class="preset-btn" data-min="3">3 min</button>
      <button class="preset-btn selected" data-min="5">5 min</button>
      <button class="preset-btn" data-min="10">10 min</button>
      <button class="preset-btn" data-min="15">15 min</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-label">Sumar o restar tiempo</div>
    <div class="adjust-row">
      <button class="adjust-btn btn-sub" id="btnSub" aria-label="Restar tiempo">−</button>
      <div class="adjust-input-wrap">
        <label for="adjustAmount">Minutos</label>
        <input type="number" id="adjustAmount" min="0" step="0.5" value="1" inputmode="decimal">
      </div>
      <button class="adjust-btn btn-add" id="btnAdd" aria-label="Sumar tiempo">+</button>
    </div>
    <div class="adjust-hint">Se aplica al tiempo que queda, ¡aunque esté en marcha!</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn btn-reset" id="btnReset" aria-label="Reiniciar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
      Reiniciar
    </button>
    <button class="ctrl-btn btn-start" id="btnStart" aria-label="Iniciar">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
      Iniciar
    </button>
    <button class="ctrl-btn btn-pause hidden" id="btnPause" aria-label="Pausar">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
      Pausar
    </button>
  </div>

<script>
window.addEventListener('error', function (e) {
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#FF5C5C;color:#fff;' +
    'font-family:monospace;font-size:12px;padding:10px;z-index:9999;white-space:pre-wrap;';
  box.textContent = 'Error JS: ' + e.message + ' (linea ' + e.lineno + ')';
  document.body.appendChild(box);
});

(function () {
  "use strict";

  // ---------- Elements ----------
  const barFill = document.getElementById('barFill');
  const readout = document.getElementById('readout');
  const stateLabel = document.getElementById('stateLabel');
  const presetsWrap = document.getElementById('presets');
  const btnStart = document.getElementById('btnStart');
  const btnPause = document.getElementById('btnPause');
  const btnReset = document.getElementById('btnReset');
  const customMin = document.getElementById('customMin');
  const customSec = document.getElementById('customSec');
  const btnFijar = document.getElementById('btnFijar');
  const adjustAmount = document.getElementById('adjustAmount');
  const btnAdd = document.getElementById('btnAdd');
  const btnSub = document.getElementById('btnSub');

  // ---------- State ----------
  let totalSeconds = 5 * 60;    // denominador para el % de la barra
  let remaining = totalSeconds; // segundos restantes
  let running = false;
  let intervalId = null;
  let lastTick = null;
  let finished = false;
  let finishedBanner = null;
  let chimeIntervalId = null;

  // ---------- Helpers ----------
  function formatTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function colorForRemaining(remSec, total) {
    if (remSec <= 10) return '#FF5C5C';
    if (remSec <= 60 || (total > 0 && remSec / total <= 0.2)) return '#FFB100';
    return '#2EC4B6';
  }

  function render() {
    const pct = totalSeconds > 0 ? Math.max(0, Math.min(100, (remaining / totalSeconds) * 100)) : 0;
    barFill.style.width = pct.toFixed(2) + '%';
    readout.textContent = formatTime(remaining);
    barFill.style.background = colorForRemaining(Math.round(remaining), totalSeconds);

    if (Math.round(remaining) <= 10 && remaining > 0 && running) {
      readout.classList.add('pulse');
    } else {
      readout.classList.remove('pulse');
    }

    if (!running && !finished) {
      stateLabel.textContent = 'Pausado';
    } else if (running) {
      stateLabel.textContent = 'En marcha';
    } else if (finished) {
      stateLabel.textContent = '¡Tiempo!';
    }
  }

  function clearPresetSelection() {
    document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('selected'));
  }

  function setPresetMinutes(min) {
    if (running) return;
    totalSeconds = min * 60;
    remaining = totalSeconds;
    finished = false;
    removeFinishedBanner();
    customMin.value = min;
    customSec.value = 0;
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.classList.toggle('selected', Number(btn.dataset.min) === min);
    });
    stateLabel.textContent = 'Listo';
    render();
  }

  function setCustomTime() {
    if (running) return;
    let min = parseInt(customMin.value, 10);
    let sec = parseInt(customSec.value, 10);
    if (isNaN(min) || min < 0) min = 0;
    if (isNaN(sec) || sec < 0) sec = 0;
    if (sec > 59) sec = 59;
    if (min > 180) min = 180;
    customMin.value = min;
    customSec.value = sec;
    const newTotal = min * 60 + sec;
    if (newTotal <= 0) return; // no permitir 0
    totalSeconds = newTotal;
    remaining = newTotal;
    finished = false;
    removeFinishedBanner();
    clearPresetSelection();
    stateLabel.textContent = 'Listo';
    render();
  }

  // ---------- Sumar / restar tiempo ----------
  function getAdjustSeconds() {
    let val = parseFloat(adjustAmount.value);
    if (isNaN(val) || val < 0) val = 0;
    return Math.round(val * 60); // minutos -> segundos, permite decimales (0.5 = 30s)
  }

  function addTime() {
    const delta = getAdjustSeconds();
    if (delta <= 0) return;
    remaining += delta;
    if (remaining > totalSeconds) totalSeconds = remaining; // la barra nunca se pasa de 100%
    if (finished && remaining > 0) {
      finished = false;
      stopChimeLoop();
      removeFinishedBanner();
    }
    clearPresetSelection();
    syncCustomInputsFromRemaining();
    render();
  }

  function subtractTime() {
    const delta = getAdjustSeconds();
    if (delta <= 0) return;
    remaining = Math.max(0, remaining - delta);
    clearPresetSelection();
    syncCustomInputsFromRemaining();
    render();
    if (remaining <= 0 && running) {
      stopInterval();
      running = false;
      finished = true;
      onFinished();
    }
  }

  function syncCustomInputsFromRemaining() {
    customMin.value = Math.floor(remaining / 60);
    customSec.value = Math.round(remaining % 60);
  }

  // ---------- Timer engine ----------
  function tick() {
    const now = Date.now();
    const elapsed = (now - lastTick) / 1000;
    lastTick = now;
    remaining = Math.max(0, remaining - elapsed);
    render();

    if (remaining <= 0) {
      remaining = 0;
      stopInterval();
      running = false;
      finished = true;
      onFinished();
    }
  }

  function startInterval() {
    lastTick = Date.now();
    intervalId = setInterval(tick, 200);
  }

  function stopInterval() {
    if (intervalId) {
      clearInterval(intervalId);
      intervalId = null;
    }
  }

  function start() {
    if (running || remaining <= 0) return;
    running = true;
    finished = false;
    removeFinishedBanner();
    unlockAudio();
    btnStart.classList.add('hidden');
    btnPause.classList.remove('hidden');
    setLockDuringRun(true);
    startInterval();
    render();
  }

  function pause() {
    if (!running) return;
    running = false;
    stopInterval();
    btnPause.classList.add('hidden');
    btnStart.classList.remove('hidden');
    setLockDuringRun(false);
    readout.classList.remove('pulse');
    render();
  }

  function reset() {
    stopInterval();
    stopChimeLoop();
    running = false;
    finished = false;
    remaining = totalSeconds;
    btnPause.classList.add('hidden');
    btnStart.classList.remove('hidden');
    setLockDuringRun(false);
    readout.classList.remove('pulse');
    removeFinishedBanner();
    syncCustomInputsFromRemaining();
    render();
  }

  function setLockDuringRun(locked) {
    // Mientras corre, bloquea "Fijar tiempo" y presets (para no reiniciar sin querer),
    // pero deja disponible sumar/restar tiempo sobre la marcha.
    document.querySelectorAll('.preset-btn').forEach(btn => { btn.disabled = locked; });
    btnFijar.disabled = locked;
    customMin.disabled = locked;
    customSec.disabled = locked;
  }

  function onFinished() {
    btnPause.classList.add('hidden');
    btnStart.classList.remove('hidden');
    setLockDuringRun(false);
    readout.classList.remove('pulse');
    render();
    playChime();
    startChimeLoop();
    showFinishedBanner();
    if (navigator.vibrate) {
      navigator.vibrate([200, 100, 200, 100, 400]);
    }
  }

  function showFinishedBanner() {
    removeFinishedBanner();
    finishedBanner = document.createElement('div');
    finishedBanner.className = 'finished-banner';
    finishedBanner.textContent = '🎉 ¡Tiempo terminado! Toca para continuar';
    finishedBanner.addEventListener('click', dismissFinished);
    document.body.appendChild(finishedBanner);
  }

  function removeFinishedBanner() {
    if (finishedBanner) {
      finishedBanner.remove();
      finishedBanner = null;
    }
  }

  function dismissFinished() {
    finished = false;
    stopChimeLoop();
    removeFinishedBanner();
    render();
  }

  // ---------- Sound (Web Audio API, sin archivos externos) ----------
  let audioCtx = null;

  function unlockAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, startTime, duration, gainPeak) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  }

  function playChime() {
    unlockAudio();
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // do-mi-sol-do, alegre y ascendente
    notes.forEach((freq, i) => {
      playTone(freq, t0 + i * 0.16, 0.35, 0.22);
    });
  }

  function startChimeLoop() {
    stopChimeLoop();
    chimeIntervalId = setInterval(() => {
      if (finished) playChime();
      else stopChimeLoop();
    }, 3000);
  }

  function stopChimeLoop() {
    if (chimeIntervalId) {
      clearInterval(chimeIntervalId);
      chimeIntervalId = null;
    }
  }

  // ---------- Event listeners ----------
  presetsWrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.preset-btn');
    if (!btn || btn.disabled) return;
    setPresetMinutes(Number(btn.dataset.min));
  });

  btnFijar.addEventListener('click', setCustomTime);
  btnAdd.addEventListener('click', addTime);
  btnSub.addEventListener('click', subtractTime);

  btnStart.addEventListener('click', start);
  btnPause.addEventListener('click', pause);
  btnReset.addEventListener('click', reset);

  // ---------- Init ----------
  syncCustomInputsFromRemaining();
  render();
})();
</script>
</body>
</html>
